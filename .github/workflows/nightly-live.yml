# Opt-in nightly leg that reaches the outside world (job-tracker-spec 13 §7,
# A-01). It is OFF until the owner opts in:
#
#   ai-live       T7-11, the contract test against the live OpenAI Decisions
#                 API (apps/api/src/jobs/ai/openai.live.test.ts). Opt in with
#                 the repository variable JOBS_AI_LIVE = 1 AND the secret
#                 OPENAI_API_KEY (a key with a hard monthly cap; the test makes
#                 a handful of small calls, well under the $1/night budget).
#
# A failure here is a signal (provider contract change), not a merge gate.
# Nothing here deploys or writes to a Cloudflare resource.
name: Nightly live checks

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  ai-live:
    if: vars.JOBS_AI_LIVE == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Require the OPENAI_API_KEY secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::JOBS_AI_LIVE=1 but the OPENAI_API_KEY secret is not set."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install the workspace
        working-directory: .
        run: bun install --frozen-lockfile
      - name: T7-11 live Decisions contract (A-01)
        env:
          JOBS_AI_LIVE: "1"
          # Optional: an OpenAI-compatible base URL (e.g. a regional endpoint).
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
        run: bun test src/jobs/ai/openai.live.test.ts
